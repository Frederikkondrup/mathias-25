<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forkert bord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Fredericka+the+Great&family=Jost:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --tavle: #1b2420;
    --kridt: #ece9e0;
    --kridt-svag: #a9b2ac;
    --gul: #f2d37e;
    --rosa: #efa7a2;
    --trae: #6f4a2e;
    --trae-lys: #93683f;
    --trae-moerk: #472d1a;
    --ramme: clamp(8px, 1.6vw, 16px);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--tavle) radial-gradient(60% 40% at 20% 15%, rgba(236,233,224,.07), transparent 72%);
    color: var(--kridt); font: 400 1.0625rem/1.55 "Jost", "Avenir Next", system-ui, sans-serif;
    padding: calc(var(--ramme) + 24px) calc(var(--ramme) + 18px);
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    border: var(--ramme) solid var(--trae);
    border-image: linear-gradient(160deg, var(--trae-lys), var(--trae) 25%, var(--trae-moerk) 50%, var(--trae) 72%, var(--trae-lys)) 1;
    box-shadow: inset 0 0 32px rgba(0,0,0,.55);
  }
  main { width: min(100%, 32rem); display: grid; gap: 1.2rem; }
  main[hidden] { display: none; }
  .eyebrow { margin: 0; font: 500 .76rem/1.2 "Jost", sans-serif; letter-spacing: .2em; text-transform: uppercase; color: var(--kridt-svag); }
  h1 { margin: 0; font: 400 clamp(2.2rem, 9vw, 3rem)/1.05 "Fredericka the Great", "Chalkboard SE", cursive; text-wrap: balance; }
  p { margin: 0; }
  .haand { font: 700 1.6rem/1.2 "Caveat", cursive; color: var(--rosa); word-break: break-word; }
  a {
    justify-self: start; font: 700 1.45rem/1 "Caveat", cursive; color: var(--gul); text-decoration: none;
    border: 2px solid var(--gul); border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px; padding: .5rem 1.2rem .6rem;
  }
  a:focus-visible { outline: 2px dashed var(--gul); outline-offset: 4px; }
</style>
</head>
<body>
<main id="forkert" hidden>
  <p class="eyebrow">Forkert bord</p>
  <h1>Det kodeord står ikke på tavlen</h1>
  <p class="haand" id="ord"></p>
  <p>Tjek bogstaverne i de gule felter i krydsordet, og prøv igen.</p>
  <a href="/mathias-25/">Prøv igen</a>
</main>
<script>
(async () => {
  const BASE = '/mathias-25/';
  // SHA-256 af kodeordet, så det ikke står i klartekst her.
  const NOEGLE = '9cd910678c2ffb5bdce8dc89ea33bf718b2b485913b63c602e8cb5c28bdc2f2c';

  let sti = location.pathname;
  try { sti = decodeURIComponent(sti); } catch (e) {}
  const rest = sti.startsWith(BASE) ? sti.slice(BASE.length) : sti.replace(/^\/+/, '');
  const skrevet = (rest.split('/').find(Boolean) || '').trim();

  const normal = skrevet.normalize('NFC').toLowerCase()
    .replace(/oe|ö/g, 'ø').replace(/ae|ä/g, 'æ').replace(/aa/g, 'å')
    .replace(/[^a-zæøå]/g, '');
  const kandidater = [...new Set([normal, normal.replace(/o/g, 'ø')])].filter(Boolean);

  const hash = async (s) => {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
  };

  if (window.crypto && crypto.subtle) {
    for (const k of kandidater) {
      if (await hash(k) === NOEGLE) {
        location.replace(BASE + encodeURIComponent(k) + '/');
        return;
      }
    }
  }
  if (skrevet) document.getElementById('ord').textContent = '»' + skrevet + '«';
  document.getElementById('forkert').hidden = false;
})();
</script>
</body>
</html>
